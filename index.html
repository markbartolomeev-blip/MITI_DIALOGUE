html{height:100%;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{

#bg-spiral{position:fixed;inset:-50%;width:200%;height:200%;z-index:-1;

#bg-overlay{position:fixed;inset:0;z-index:-1;

@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:12px}
#scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;position:relative}
#pk{height:min(46vh,340px);max-width:92%;object-fit:contain;filter:drop-shadow(0 6px 14px #0008);animation:fl 3s ease-in-out infinite;transition:filter .3s,opacity .3s;opacity:.75}
#pe{font-size:min(38vh,220px);line-height:1;display:none;animation:fl 3s ease-in-out infinite}
#pk.on{filter:drop-shadow(0 0 28px var(--glow)) drop-shadow(0 0 50px #ff8a1f80);opacity:1}
@keyframes fl{50%{transform:translateY(-8px)}}
#me{position:absolute;left:4px;bottom:0;font-size:44px;opacity:.35;transition:.3s}
#me.on{opacity:1;filter:drop-shadow(0 0 14px var(--us))}
#box{background:#1d1128ee;border:2px solid var(--pk);border-radius:14px;padding:12px 16px 16px;min-height:140px;position:relative;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 0 30px #ff8a1f33, inset 0 0 20px #00000055;transition:border-color .3s, box-shadow .3s}
#box.u{border-color:var(--us);box-shadow:0 0 30px #6fb4ff33, inset 0 0 20px #00000055}
#nm{font-weight:700;color:var(--pk);margin-bottom:6px;font-size:15px;text-shadow:0 0 8px #ff8a1f80}
#box.u #nm{color:var(--us);text-shadow:0 0 8px #6fb4ff80}
#tx{font-size:18px;line-height:1.45;min-height:3em}
#ar{position:absolute;right:12px;bottom:6px;color:var(--pk);animation:bl 1s infinite;display:none}
@keyframes bl{50%{opacity:0}}
#ch{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#ch button,.btn{background:#2c1840ee;color:var(--tx);border:1.5px solid var(--us);border-radius:12px;padding:12px 14px;font-size:16px;text-align:left;cursor:pointer;font-family:inherit;transition:background .2s, transform .1s, box-shadow .2s;box-shadow:0 0 15px #6fb4ff22}

#end{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}

#lab{font-size:30px;font-weight:800;margin:6px 0 14px;text-shadow:0 0 15px currentColor}

#start{position:fixed;inset:0;background:#120a1cee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:20;backdrop-filter:blur(4px);overflow-y:auto}

.save-status.err{color:#e33;opacity:1}
.shake{animation:shake 0.4s cubic-bezier(.36,.07,.19,.97) both}

@keyframes shake-strong{10%,90%{transform:translate3d(-4px,-2px,0)}20%,80%{transform:translate3d(8px,2px,0)}30%,50%,70%{transform:translate3d(-12px,-2px,0)}40%,60%{transform:translate3d(12px,2px,0)}}
.locked-badge{display:inline-block;background:#e33;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;margin-bottom:10px;letter-spacing:1px;text-transform:uppercase}
#loading{position:fixed;inset:0;background:#120a1c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;z-index:100;text-align:center}

#loading .loading-pumpkin{font-size:70px;animation:fl 2s ease-in-out infinite;filter:drop-shadow(0 0 20px #ff8a1faa)}

function preloadAllImages(){
  const entries=Object.entries(IMG);
  const total=entries.length;
  let loaded=0,failed=0;
  const progressBar=document.getElementById("progressBar");
  const progressText=document.getElementById("progressText");
  const progressName=document.getElementById("progressName");

  return new Promise(resolve=>{
    entries.forEach(([key,url])=>{
      const img=new Image();
      img.onload=()=>{loaded++;updateProgress()};
      img.onerror=()=>{failed++;loaded++;updateProgress()};
      img.src=url;
      progressName.textContent=`Загрузка: ${NAMES_FOR_LOAD[key]||key}...`;
      function updateProgress(){
        const pct=Math.round((loaded/total)*100);
        progressBar.style.width=pct+"%";
        progressText.textContent=pct+"%";
        if(loaded>=total){
          progressText.textContent="100% — Готово!";
          progressName.textContent=failed>0?`Загружено ${total-failed} из ${total}`:`Все ${total} эмоций загружены 🎃`;
          setTimeout(resolve,400);
        }
      }
    });
  });
}

const RULES=[
  [/Растерянно|^\.{3,}/,"conf"],[/ПОШЕЛ ОТСЮДА|Ударяет/,"rage"],
  [/блюдечке|диагноз|КАКАЯ|не стальные/,"angry"],
  [/избавиться от этого|А, ясно|Вот значит|цепляться за слова/,"bored"],
  [/Ладно, мне все ясно|Ничего, просто понял/,"disap"],
  [/Кстати да/,"into"],[/Поговаривают|Типо того|С Лилей|Зай, я сам/,"slay"]
];
function emo(t){for(const[r,e]of RULES)if(r.test(t))return e;return"greet"}

const pk=document.getElementById("pk");
pk.onerror=()=>{pk.style.display="none";document.getElementById("pe").style.display="block"};
pk.onload=()=>{pk.style.display="";document.getElementById("pe").style.display="none"};

const $=id=>document.getElementById(id);
let q=[],cur=null,pend=null,typing=false,tm=null,full="";
let currentPlayerName="",currentChoices=[];

function shakeScreen(strong=false){
  const app=document.getElementById("app");
  app.classList.remove("shake","shake-strong");void app.offsetWidth;
  app.classList.add(strong?"shake-strong":"shake");
  setTimeout(()=>app.classList.remove("shake","shake-strong"),500);
}
function type(who,text){
  const u=who===U;$("box").className=u?"u":"";
  $("nm").textContent=u?"Ты":"Тыква";
  if(!u){pk.src=IMG[emo(text)];if(/Ударяет/.test(text))shakeScreen(true)}
  pk.classList.toggle("on",!u);$("me").classList.toggle("on",u);
  $("ar").style.display="none";full=text;let i=0;typing=true;$("tx").textContent="";
  clearInterval(tm);tm=setInterval(()=>{i++;$("tx").textContent=text.slice(0,i);if(i>=text.length)fin()},28);
}
function fin(){clearInterval(tm);typing=false;$("tx").textContent=full;$("ar").style.display="block"}
function go(id){cur=N[id];q=cur.l.slice();next()}
function next(){
  if(typing){fin();return}
  if($("ch").children.length||$("end").style.display==="flex")return;
  if(q.length){const[w,t]=q.shift();type(w,t);return}
  if(pend){const id=pend;pend=null;go(id);return}
  if(cur.n){const id=cur.n;cur=Object.assign({},cur,{n:null});go(id);return}
  if(cur.c){
    $("ar").style.display="none";
    cur.c.forEach(([t,id])=>{
      const b=document.createElement("button");
      b.textContent=t;
      b.onclick=()=>{currentChoices.push(t);$("ch").innerHTML="";pend=id;q=[];type(U,t)};
      $("ch").appendChild(b);
    });
  }else if(cur.e){showEnding(cur.e)}
}

/* ==== Поиск игрока в Firebase по имени ==== */
async function findPlayerInFirebase(name){
  if(!db) return null;
  try{
    const safeName = name.replace(/[.#$\[\]\/]/g, "_");
    const playerRef = ref(db, 'tykva_saves/' + safeName);
    const snapshot = await get(playerRef);
    if(snapshot.exists()){
      return snapshot.val();
    }
    return null;
  }catch(err){
    console.error("Firebase ошибка чтения:", err);
    return null;
  }
}

/* ==== Запись/обновление результата в Firebase ==== */
async function sendToFirebase(name,relation,level,choices){
  if(!db) return {ok:false,error:"Firebase не подключён"};
  try{
    const safeName = name.replace(/[.#$\[\]\/]/g, "_");
    const playerRef = ref(db, 'tykva_saves/' + safeName);
    await set(playerRef, {name, relation, level, date: Date.now(), choices});
    return {ok:true};
  }catch(err){
    console.error("Firebase ошибка:", err);
    return {ok:false,error:err.message};
  }
}

function showEndingFromData(data){
  const relation = data.relation;
  const [n,c] = LV[relation] || [3,"#fd3"];
  $("lab").textContent = relation;
  $("lab").style.color = c;
  [...$("mt").children].forEach((s,i)=>{
    s.style.background = i<n ? c : "";
    s.style.boxShadow = i<n ? `0 0 10px ${c}` : "";
  });
  $("ending-text").textContent = ENDING_TEXT[relation] || "";
  $("ending-text").style.borderLeftColor = c;
  $("saveStatus").textContent = `Это результат игрока «${data.name}»`;
  $("saveStatus").className = "save-status ok";
  $("end").style.display = "flex";
}

async function showEnding(relation){
  const[n,c]=LV[relation];
  $("lab").textContent=relation;$("lab").style.color=c;
  [...$("mt").children].forEach((s,i)=>{s.style.background=i<n?c:"";s.style.boxShadow=i<n?`0 0 10px ${c}`:""});
  $("ending-text").textContent=ENDING_TEXT[relation]||"";
  $("ending-text").style.borderLeftColor=c;
  const st=$("saveStatus");st.textContent="Сохраняем...";st.className="save-status";
  $("end").style.display="flex";
  const result=await sendToFirebase(currentPlayerName,relation,n,currentChoices);
  if(result.ok){st.textContent=`✓ Результат для «${currentPlayerName}» сохранён`;st.className="save-status ok"}
  else{st.textContent=`⚠ Не сохранилось: ${result.error}`;st.className="save-status err"}
}

function begin(){

      <div style="display:flex;gap:5px;margin-bottom:14px">

/* ============================================================
   ГЛАВНАЯ ЛОГИКА ЗАПУСКА
   ============================================================ */
(async () => {
  await preloadAllImages();
  $("loading").style.display = "none";
  pk.src = IMG.greet;
  $("si").src = IMG.greet;
  $("start").style.display = "flex";

  const nameInput = $("nameInput");
  const goBtn = $("go");
  const startStatus = $("startStatus");
  const nameHint = $("nameHint");

  nameInput.addEventListener("input", () => {
    const v = nameInput.value.trim();
    if(v.length >= 1){
      goBtn.disabled = false;
      nameHint.classList.remove("error");
      nameHint.textContent = "Указывай своё настоящее имя";
      nameHint.style.color = "#ffffff66";
    } else {
      goBtn.disabled = true;
    }
    startStatus.textContent = "";
    startStatus.className = "save-status";
  });

  goBtn.addEventListener("click", async () => {
    const v = nameInput.value.trim();
    if(v.length < 1){
      nameHint.textContent = "Пожалуйста, укажи своё имя!";
      nameHint.classList.add("error");
      nameInput.classList.add("error");
      nameInput.focus();
      setTimeout(() => nameInput.classList.remove("error"), 500);
      return;
    }
    currentPlayerName = v;

    // Показываем индикатор "проверяем..."
    goBtn.disabled = true;
    goBtn.textContent = "Проверяем...";
    startStatus.textContent = "Проверяем, есть ли ты в базе...";
    startStatus.className = "save-status";

    // Ищем игрока в Firebase
    const existing = await findPlayerInFirebase(currentPlayerName);

    if(existing){
      // Уже есть результат — показываем его
      showExistingResult(existing);
    } else {
      // Новый игрок — начинаем диалог
      startStatus.textContent = "";
      goBtn.textContent = "Начать";
      $("start").style.display = "none";
      begin();
    }
  });

  nameInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !goBtn.disabled) goBtn.click();
  });

  $("box").addEventListener("click", next);
  $("ch").addEventListener("click", (e) => {
    if(e.target.tagName !== "BUTTON") next();
  });
})();
</script>
